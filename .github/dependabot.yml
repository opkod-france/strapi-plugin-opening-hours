version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    groups:
      strapi:
        patterns:
          - "@strapi/*"
      testing:
        patterns:
          - "@testing-library/*"
          - jest
          - jest-*
          - ts-jest
          - "@types/jest"
      dev-tooling:
        patterns:
          - typescript
          - husky
          - semantic-release
          - "@commitlint/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
    commit-message:
      prefix: "ci(deps):"
